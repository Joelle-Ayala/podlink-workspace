<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 2200" role="img" aria-label="Podlink login hero art">
  <!-- Podlink auth/login hero art. Abstract waveform-in-pill visual language,
       matching podlink-logo-dark-bg.svg / podlink-mark-dark-bg.svg.
       Palette strictly: #FF8C00 (primary), #0f0f12 (background/near-black),
       #f0ede6 (off-white), #cc7000 (darker orange, depth/gradient stops only).
       No rendered text. -->
  <defs>
    <radialGradient id="glowTop" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8C00" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#cc7000" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#cc7000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBottom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cc7000" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#cc7000" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#cc7000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pillFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#cc7000"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#cc7000"/>
    </linearGradient>
    <linearGradient id="vignetteEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f0f12" stop-opacity="0.9"/>
      <stop offset="18%" stop-color="#0f0f12" stop-opacity="0"/>
      <stop offset="82%" stop-color="#0f0f12" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0f0f12" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
  </defs>

  <!-- Base background -->
  <rect x="0" y="0" width="1800" height="2200" fill="#0f0f12"/>

  <!-- Ambient glow blobs -->
  <circle cx="1300" cy="420" r="620" fill="url(#glowTop)" filter="url(#softBlur)"/>
  <circle cx="420" cy="1850" r="560" fill="url(#glowBottom)" filter="url(#softBlur)"/>

  <!-- Faint concentric sound-ripple rings, emanating from upper-right focal point -->
  <g fill="none" stroke="#FF8C00" stroke-width="2">
    <circle cx="1360" cy="480" r="260" opacity="0.10"/>
    <circle cx="1360" cy="480" r="380" opacity="0.08"/>
    <circle cx="1360" cy="480" r="500" opacity="0.06"/>
    <circle cx="1360" cy="480" r="620" opacity="0.04"/>
    <circle cx="1360" cy="480" r="740" opacity="0.03"/>
  </g>

  <!-- Subtle dot-grid texture, analytics/data feel, lower-right quadrant -->
  <g fill="#f0ede6" opacity="0.06">
    <!-- generated dot grid -->
    <g id="dotgrid"></g>
  </g>

  <!-- Faint horizontal data/level lines, right side, suggesting an analytics strip -->
  <g stroke="#f0ede6" stroke-width="1.5" opacity="0.08">
    <line x1="1120" y1="1650" x2="1720" y2="1650"/>
    <line x1="1120" y1="1690" x2="1650" y2="1690"/>
    <line x1="1120" y1="1730" x2="1700" y2="1730"/>
    <line x1="1120" y1="1770" x2="1600" y2="1770"/>
  </g>

  <!-- Small satellite waveform cluster, top-left, rotated -->
  <g transform="translate(230,300) rotate(-18)" opacity="0.5">
    <rect x="-60" y="-46" width="120" height="92" rx="46" fill="none" stroke="#FF8C00" stroke-width="3" opacity="0.55"/>
    <g fill="#FF8C00">
      <rect x="-38" y="-8" width="9" height="16" rx="4.5"/>
      <rect x="-22" y="-16" width="9" height="32" rx="4.5"/>
      <rect x="-6"  y="-22" width="9" height="44" rx="4.5"/>
      <rect x="10"  y="-16" width="9" height="32" rx="4.5"/>
      <rect x="26"  y="-8"  width="9" height="16" rx="4.5"/>
    </g>
  </g>

  <!-- Small satellite waveform cluster, lower-left -->
  <g transform="translate(300,1980) rotate(10)" opacity="0.35">
    <rect x="-52" y="-40" width="104" height="80" rx="40" fill="none" stroke="#f0ede6" stroke-width="2.5" opacity="0.4"/>
    <g fill="#f0ede6" opacity="0.55">
      <rect x="-32" y="-6"  width="8" height="12" rx="4"/>
      <rect x="-18" y="-13" width="8" height="26" rx="4"/>
      <rect x="-4"  y="-18" width="8" height="36" rx="4"/>
      <rect x="10"  y="-13" width="8" height="26" rx="4"/>
      <rect x="24"  y="-6"  width="8" height="12" rx="4"/>
    </g>
  </g>

  <!-- Small satellite waveform cluster, far right mid -->
  <g transform="translate(1660,1080) rotate(24)" opacity="0.4">
    <g fill="#cc7000">
      <rect x="-30" y="-6"  width="8" height="12" rx="4"/>
      <rect x="-16" y="-14" width="8" height="28" rx="4"/>
      <rect x="-2"  y="-20" width="8" height="40" rx="4"/>
      <rect x="12"  y="-14" width="8" height="28" rx="4"/>
      <rect x="26"  y="-6"  width="8" height="12" rx="4"/>
    </g>
  </g>

  <!-- HERO: oversized pill-in-waveform composition, center, slightly rotated for dynamism -->
  <g transform="translate(900,1080) rotate(-6)">
    <!-- soft glow behind hero pill -->
    <ellipse cx="0" cy="0" rx="560" ry="380" fill="#FF8C00" opacity="0.10" filter="url(#softBlur)"/>

    <!-- outer pill ring, thin outline echo for depth -->
    <rect x="-560" y="-330" width="1120" height="660" rx="330" fill="none" stroke="#FF8C00" stroke-width="2" opacity="0.18"/>

    <!-- main pill -->
    <rect x="-500" y="-290" width="1000" height="580" rx="290" fill="url(#pillFill)"/>

    <!-- waveform bars inside the hero pill -->
    <g fill="#0f0f12">
      <rect x="-380" y="-40"  width="46" height="80"  rx="23"/>
      <rect x="-310" y="-90"  width="46" height="180" rx="23"/>
      <rect x="-240" y="-140" width="46" height="280" rx="23"/>
      <rect x="-170" y="-190" width="46" height="380" rx="23"/>
      <rect x="-100" y="-230" width="46" height="460" rx="23"/>
      <rect x="-30"  y="-260" width="46" height="520" rx="23"/>
      <rect x="40"   y="-230" width="46" height="460" rx="23"/>
      <rect x="110"  y="-190" width="46" height="380" rx="23"/>
      <rect x="180"  y="-140" width="46" height="280" rx="23"/>
      <rect x="250"  y="-90"  width="46" height="180" rx="23"/>
      <rect x="320"  y="-40"  width="46" height="80"  rx="23"/>
    </g>
  </g>

  <!-- Fine linework: single sweeping waveform stroke crossing the lower third,
       suggesting a scrolling episode timeline -->
  <path d="M -40 1980
           C 200 1930, 340 2040, 520 1970
           S 860 1870, 1040 1950
           S 1380 2050, 1560 1960
           S 1900 1880, 2040 1950"
        fill="none" stroke="#FF8C00" stroke-width="3" opacity="0.22"/>
  <path d="M -40 2040
           C 220 2000, 360 2090, 540 2020
           S 880 1940, 1060 2010
           S 1400 2100, 1580 2020
           S 1920 1950, 2060 2010"
        fill="none" stroke="#f0ede6" stroke-width="2" opacity="0.10"/>

  <!-- Small dot accents, episode/track markers -->
  <g fill="#FF8C00">
    <circle cx="1460" cy="330" r="5" opacity="0.7"/>
    <circle cx="1520" cy="380" r="3.5" opacity="0.5"/>
    <circle cx="240" cy="1720" r="4" opacity="0.5"/>
    <circle cx="1640" cy="1520" r="4.5" opacity="0.55"/>
    <circle cx="180" cy="620" r="3.5" opacity="0.45"/>
  </g>

  <!-- edge vignette for clean cover-crop at any viewport width -->
  <rect x="0" y="0" width="1800" height="2200" fill="url(#vignetteEdge)"/>
  <rect x="0" y="0" width="1800" height="2200" fill="none"/>
</svg>
