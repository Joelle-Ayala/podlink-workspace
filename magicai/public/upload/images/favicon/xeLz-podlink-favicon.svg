<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="PodLink">
  <!-- PodLink favicon — 3 thick bars so the waveform survives 16px.
       Dark (#0f0f12) bars on the orange pill read on both light and
       dark browser chrome, since the pill itself is the background. -->
  <rect x="1" y="7" width="30" height="18" rx="9" fill="#FF8C00"/>
  <g fill="#0f0f12">
    <rect x="8"  y="12" width="4" height="8"  rx="2"/>
    <rect x="14" y="10" width="4" height="12" rx="2"/>
    <rect x="20" y="12" width="4" height="8"  rx="2"/>
  </g>
</svg>
